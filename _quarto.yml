project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - setup.qmd
    - materials.qmd
    - R_part*.qmd
  resources:
    - downloads/**

website:
  title: "Data Analysis in R"
  favicon: figures/MPS_logo.png
  description: "Installation instructions, interactive presentations, and workshop files for an introductory Data Analysis in R course."
  site-url: "https://jgacnik.github.io/r-data-workshop/"
  repo-url: "https://github.com/jgacnik/r-data-workshop"
  repo-actions: [source, issue]
  search: true
  navbar:
    logo: figures/MPS_logo.png
    left:
      - href: setup.qmd
        text: Setup
      - href: materials.qmd
        text: Materials
    right:
      - icon: github
        href: "https://github.com/jgacnik/r-data-workshop"
        aria-label: "Course repository on GitHub"
  page-footer:
    left: "Workshop developed and led by Asst. Prof. Jan Gačnik"
    right:
      - text: "Contact Jan Gačnik at jan.gacnik@ijs.si"
        href: "mailto:jan.gacnik@ijs.si"

format:
  html:
    theme: cosmo
    css: site.css
    toc: true
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
